apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "93.4.0"

      # If want to auto-apply minor revision updates.
      # version: "82.*"

      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # k3s runs the scheduler, controller-manager and kube-proxy inside the
    # single k3s server process (no pods to scrape), and a single-node k3s uses
    # SQLite rather than etcd. The chart's monitors for them never get data and
    # their *Down alerts fire forever, so turn them off.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    alertmanager:
      alertmanagerSpec:
        # Mounted at /etc/alertmanager/secrets/alertmanager-smtp/ (sops-encrypted
        # in monitoring/configs/staging/kube-prometheus-stack/alertmanager-smtp.yaml).
        secrets:
          - alertmanager-smtp
      config:
        global:
          resolve_timeout: 5m
          smtp_smarthost: smtp.protonmail.ch:587
          smtp_from: The League Tracker alerts <admin@theleaguetracker.com>
          smtp_auth_username: admin@theleaguetracker.com
          smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
          smtp_require_tls: true
        # Same inhibit rules as the chart's default config.
        inhibit_rules:
          - equal: [namespace, alertname]
            source_matchers: ["severity = critical"]
            target_matchers: ["severity =~ warning|info"]
          - equal: [namespace, alertname]
            source_matchers: ["severity = warning"]
            target_matchers: ["severity = info"]
          - equal: [namespace]
            source_matchers: ["alertname = InfoInhibitor"]
            target_matchers: ["severity = info"]
          - target_matchers: ["alertname = InfoInhibitor"]
        route:
          group_by: [namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "null"
          routes:
            - matchers: ['alertname = "Watchdog"']
              receiver: "null"
            # Only The League Tracker's alerts are emailed; everything else stays
            # in the Alertmanager/Grafana UI.
            - matchers: ['namespace = "theleaguetracker"']
              receiver: theleaguetracker-email
        receivers:
          - name: "null"
          - name: theleaguetracker-email
            email_configs:
              - to: admin@theleaguetracker.com
                send_resolved: true
        templates:
          - /etc/alertmanager/config/*.tmpl
    grafana:
      adminPassword: mischa
#     admin:
#       existingSecret: ""
#       userKey: admin-user
#       passwordKey: admin-password
#
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts: 
          - grafana.malazan.wu
        path: /
        tls:
           - secretName: grafana-general-tls
             hosts:
               - grafana.malazan.wu
