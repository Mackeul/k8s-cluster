# Non-secret settings. Secrets (APP_KEY, mail credentials) live in the
# sops-encrypted "theleaguetracker-secrets" Secret in the environment overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: theleaguetracker-config
data:
  APP_NAME: "The League Tracker"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://theleaguetracker.com"
  APP_TIMEZONE: "America/Toronto"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "info"

  # Shown on the privacy and terms pages and as the footer Contact link.
  CONTACT_EMAIL: "hello@theleaguetracker.com"
  LEAGUE_LIMIT: "5"
  GOOGLE_SITE_VERIFICATION: ""

  DB_CONNECTION: "sqlite"
  DB_DATABASE: "/var/www/html/storage/app/database.sqlite"

  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "10080"
  CACHE_STORE: "file"
  QUEUE_CONNECTION: "sync"
  LOGO_DISK: "public"

  # Transactional email (sign-up confirmation, password reset, invitations).
  # TODO: switch MAIL_MAILER to "smtp" and set the host once an SMTP account
  # exists; with "log" the emails only go to the pod logs.
  MAIL_MAILER: "log"
  MAIL_HOST: "smtp.example.com"
  MAIL_PORT: "587"
  MAIL_SCHEME: "tls"
  MAIL_FROM_ADDRESS: "hello@theleaguetracker.com"
  MAIL_FROM_NAME: "The League Tracker"

  # Start-up behaviour of the container (docker/entrypoint.sh).
  RUN_MIGRATIONS: "true"
  SEED_SPORTS: "true"
