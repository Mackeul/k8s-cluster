# Prometheus scraping and alerts for The League Tracker. The kube-prometheus-stack
# Prometheus only picks up monitors and rules labelled release: kube-prometheus-stack.
# The Grafana dashboard is generated from dashboards/theleaguetracker.json (see
# kustomization.yaml); the Grafana sidecar loads it from any namespace.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: cloudflared
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: theleaguetracker
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: theleaguetracker
      rules:
        - alert: TheLeagueTrackerDown
          expr: kube_deployment_status_replicas_available{namespace="theleaguetracker", deployment="theleaguetracker"} < 1
          for: 5m
          labels:
            namespace: theleaguetracker
            severity: critical
          annotations:
            summary: The League Tracker has no ready pod
            description: theleaguetracker.com is down. Check `kubectl -n theleaguetracker get pods` and the pod logs.

        - alert: TheLeagueTrackerTunnelDown
          expr: (sum(cloudflared_tunnel_ha_connections{namespace="theleaguetracker"}) or vector(0)) < 1
          for: 5m
          labels:
            namespace: theleaguetracker
            severity: critical
          annotations:
            summary: Cloudflare tunnel for theleaguetracker.com has no connections
            description: No cloudflared pod is connected to Cloudflare's edge, so the site is unreachable from the internet.

        - alert: TheLeagueTrackerServerErrors
          expr: |
            sum(rate(cloudflared_tunnel_response_by_code{namespace="theleaguetracker", status_code=~"5.."}[10m]))
              / sum(rate(cloudflared_tunnel_total_requests{namespace="theleaguetracker"}[10m])) > 0.05
            and sum(rate(cloudflared_tunnel_total_requests{namespace="theleaguetracker"}[10m])) > 0.01
          for: 10m
          labels:
            namespace: theleaguetracker
            severity: warning
          annotations:
            summary: More than 5% of requests to theleaguetracker.com return 5xx
            description: '{{ $value | humanizePercentage }} of requests are failing. Check the app logs.'

        - alert: TheLeagueTrackerBackupStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="theleaguetracker", cronjob="theleaguetracker-backup"} > 26 * 3600
          for: 15m
          labels:
            namespace: theleaguetracker
            severity: warning
          annotations:
            summary: No successful League Tracker backup in over 26 hours
            description: The nightly R2 backup has not succeeded since {{ $value | humanizeDuration }} ago. Check `kubectl -n theleaguetracker get jobs`.

        - alert: TheLeagueTrackerMemoryHigh
          expr: |
            max(container_memory_working_set_bytes{namespace="theleaguetracker", container="app"})
              / max(kube_pod_container_resource_limits{namespace="theleaguetracker", container="app", resource="memory"}) > 0.9
          for: 15m
          labels:
            namespace: theleaguetracker
            severity: warning
          annotations:
            summary: The League Tracker is using over 90% of its memory limit
            description: The app container is at {{ $value | humanizePercentage }} of its 512Mi limit and may be OOM-killed.
