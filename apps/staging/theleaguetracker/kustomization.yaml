apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: theleaguetracker
resources:
  - ../../base/theleaguetracker/
  - cloudflare.yaml
  - cloudflare-tunnel.yaml
  - theleaguetracker-secrets.yaml
  - backup.yaml
  - backup-r2-secret.yaml
  - monitoring.yaml

# One place to bump the app version: applies to the deployment and the backup job.
images:
  - name: ghcr.io/mackeul/theleaguetracker
    newTag: v0.1.0-beta.1

# Grafana dashboard, picked up by the Grafana sidecar via the grafana_dashboard label.
configMapGenerator:
  - name: theleaguetracker-dashboard
    files:
      - dashboards/theleaguetracker.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
